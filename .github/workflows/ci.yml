name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: '.'
          severity: warning

  test:
    runs-on: ubuntu-latest
    needs: shellcheck
    steps:
      - uses: actions/checkout@v4

      - name: Run test suite
        run: |
          if compgen -G "tests/cases/*.sh" > /dev/null; then
            for f in tests/cases/*.sh; do
              echo "::group::$f"
              bash "$f"
              echo "::endgroup::"
            done
          else
            echo "No test cases found yet under tests/cases/; skipping."
          fi
