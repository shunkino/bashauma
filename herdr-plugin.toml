id = "bashauma"
name = "bashauma"
version = "1.0.1"
min_herdr_version = "0.8.0"
description = "A non-preemptive scheduler for your attention across open agent panes"
platforms = ["linux", "macos"]

[[events]]
on = "pane.agent_status_changed"
command = ["./on_status_changed.sh"]

[[actions]]
id = "next"
title = "bashauma: next"
description = "Yield to the scheduler — move focus to the highest-priority runnable pane"
command = ["./next.sh"]
platforms = ["linux", "macos"]

[[panes]]
id = "winner"
title = "🎉 Winner 🎉"
platforms = ["linux", "macos"]
placement = "popup"
width = "80%"
height = "60%"
command = ["./winner_screen.sh"]
